    <style>:root {
  color-scheme: light;
  font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Microsoft YaHei", monospace;
  background: #dce7cf;
  color: #52634f;
  -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body { min-height: 300px; }
button { font: inherit; }
#playground, #world, #egg-controls { position: absolute; inset: 0; width: 100%; height: 100%; }
#world { display: block; }
#egg-controls { pointer-events: none; z-index: 1; }
.egg {
  position: absolute;
  padding: 0;
  border: 0;
  border-radius: 46%;
  background: transparent;
  pointer-events: auto;
  cursor: default;
  touch-action: none;
  user-select: none;
  outline: none;
}
.egg:focus-visible { outline: 2px dashed #6a8164; outline-offset: 7px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}
#motion {
  position: fixed; right: 24px; bottom: 15px; z-index: 2;
  display: grid; place-items: center; width: 40px; height: 40px;
  padding: 0; border: 1px solid #80907555; border-radius: 5px;
  color: #617257; background: #edf2e2aa; pointer-events: auto; cursor: pointer;
  box-shadow: 0 2px 0 #84947633;
}
#motion:hover { background: #f4f7ed; }
#motion:active { transform: translateY(2px); box-shadow: none; }
#motion:focus-visible { outline: 2px solid #6a8164; outline-offset: 3px; }
#motion svg { width: 16px; height: 16px; fill: currentColor; }
.play-icon, #motion[aria-pressed="true"] .pause-icon { display: none; }
#motion[aria-pressed="true"] .play-icon { display: block; }
#loading { position: absolute; inset: 50% auto auto 50%; margin: -8px; pointer-events: none; }
.loading-cube { display: block; width: 16px; height: 16px; background: #92b491; box-shadow: 8px 8px #b4c7a7; animation: loading .8s steps(2) infinite; }
[data-ready="true"] #loading { display: none; }
@keyframes loading { 50% { transform: translateY(-8px); } }
.webgl-error #loading { inset: 50% 24px auto; text-align: center; font-size: 14px; line-height: 1.7; }
#usage-rail {
  position: fixed; top: 50%; right: 24px; z-index: 3;
  width: 60px; height: 60px; padding: 0; overflow: hidden;
  transform: translateY(-50%); border-radius: 999px; background: #080a0b;
  transition: width .42s cubic-bezier(.2,.75,.25,1);
  cursor: default; user-select: none;
}
#usage-rail[data-expanded="true"] { width: min(680px, calc(100vw - 32px)); }
#usage-tools {
  position: absolute; inset: 0 58px 0 12px;
  display: flex; align-items: center; gap: 8px; overflow-x: auto; overflow-y: hidden;
  opacity: 0; visibility: hidden; scrollbar-width: none; touch-action: pan-x;
  transition: opacity .18s ease .08s, visibility .18s;
}
#usage-tools::-webkit-scrollbar { display: none; }
#usage-rail[data-expanded="true"] #usage-tools { opacity: 1; visibility: visible; }
.usage-tool {
  flex: 1 0 98px; display: flex; align-items: center; gap: 6px; min-width: 0;
  color: #e9eae6; font: 11px/1.25 "Segoe UI", Arial, sans-serif;
}
.usage-tool:last-child { flex: 0 0 104px; }
.usage-gauge { position: relative; flex: 0 0 38px; width: 38px; height: 38px; }
.usage-gauge svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
.usage-gauge circle { fill: none; stroke-width: 3; }
.gauge-track { stroke: #303436; }
.gauge-value { stroke: var(--usage-color, #22c55e); stroke-dasharray: var(--usage-left, 92) 100; stroke-linecap: round; transition: stroke .2s ease; }
.usage-gauge img {
  position: absolute; inset: 9px; width: 20px; height: 20px; object-fit: contain;
  filter: brightness(0) invert(1);
}
.usage-copy { display: grid; gap: 3px; min-width: 0; white-space: nowrap; }
.usage-name { overflow: hidden; color: #e7e8e4; font-size: 11px; font-weight: 700; text-overflow: ellipsis; }
.usage-amount { color: var(--usage-color, #22c55e); font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums; }
#usage-toggle {
  position: absolute; top: 6px; right: 6px; z-index: 1;
  display: grid; place-items: center; width: 48px; height: 48px; padding: 0;
  overflow: hidden; border: 0; border-radius: 50%; background: transparent;
  touch-action: none; cursor: default; user-select: none;
}
#usage-toggle:focus-visible { outline: 2px solid #22c55e; outline-offset: -2px; }
#usage-pet { display: block; width: 38px; height: 38px; }
#usage-tooltip {
  position: fixed; z-index: 5; width: min(276px, calc(100vw - 24px)); padding: 14px;
  border: 1px solid #303535; border-radius: 13px; background: #101313; color: #e9eae6;
  box-shadow: 0 10px 30px #0008; font: 12px/1.35 "Segoe UI", Arial, sans-serif;
  pointer-events: none; user-select: none;
}
#usage-tooltip[hidden] { display: none; }
#usage-tooltip::after {
  position: absolute; left: var(--usage-tip-arrow-x); width: 9px; height: 9px;
  background: #101313; content: ""; transform: rotate(45deg);
}
#usage-tooltip[data-placement="above"]::after {

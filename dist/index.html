    <style>:root {
  color-scheme: light;
  font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Microsoft YaHei", monospace;
  background: #dce7cf;
  color: #52634f;
  -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body { min-height: 300px; }
button { font: inherit; }
#playground, #world, #egg-controls { position: absolute; inset: 0; width: 100%; height: 100%; }
#world { display: block; }
#egg-controls { pointer-events: none; z-index: 1; }
.egg {
  position: absolute;
  padding: 0;
  border: 0;
  border-radius: 46%;
  background: transparent;
  pointer-events: auto;
  cursor: pointer;
  touch-action: manipulation;
  outline: none;
}
.egg:focus-visible { outline: 2px dashed #6a8164; outline-offset: 7px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}
#motion {
  position: fixed; right: 24px; bottom: 15px; z-index: 2;
  display: grid; place-items: center; width: 40px; height: 40px;
  padding: 0; border: 1px solid #80907555; border-radius: 5px;
  color: #617257; background: #edf2e2aa; pointer-events: auto; cursor: pointer;
  box-shadow: 0 2px 0 #84947633;
}
#motion:hover { background: #f4f7ed; }
#motion:active { transform: translateY(2px); box-shadow: none; }
#motion:focus-visible { outline: 2px solid #6a8164; outline-offset: 3px; }
#motion svg { width: 16px; height: 16px; fill: currentColor; }
.play-icon, #motion[aria-pressed="true"] .pause-icon { display: none; }
#motion[aria-pressed="true"] .play-icon { display: block; }
#loading { position: absolute; inset: 50% auto auto 50%; margin: -8px; pointer-events: none; }
.loading-cube { display: block; width: 16px; height: 16px; background: #92b491; box-shadow: 8px 8px #b4c7a7; animation: loading .8s steps(2) infinite; }
[data-ready="true"] #loading { display: none; }
@keyframes loading { 50% { transform: translateY(-8px); } }
.webgl-error #loading { inset: 50% 24px auto; text-align: center; font-size: 14px; line-height: 1.7; }
@media (max-width: 600px) {
  #motion { right: 15px; bottom: 10px; }
}
@media (prefers-reduced-motion: reduce) { .loading-cube { animation: none; } }
</style>
  </head>
  <body>
    <main id="playground" aria-label="TokenPet 彩蛋游乐场">
      <h1 class="sr-only">TokenPet</h1>
      <canvas id="world" aria-hidden="true"></canvas>
      <div id="egg-controls" aria-label="彩色方块蛋"></div>
      <p id="loading" role="status"><span class="loading-cube"></span></p>
    </main>
    <button id="motion" type="button" aria-label="暂停跳动" aria-pressed="false">
      <svg class="pause-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 5h3v10H6zm5 0h3v10h-3z" /></svg>
      <svg class="play-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 9 6-9 6z" /></svg>
    </button>

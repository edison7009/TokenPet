<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#dce7cf" />
    <meta name="description" content="TokenPet — 一个正在等待孵化的方块小世界。轻轻点一下，让彩色体素蛋跳起来。" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'" />
    <title>TokenPet</title>
    <link rel="icon" href="{{FAVICON}}" />
    <!-- {{THREE_LICENSE}} -->
    <style>{{STYLE}}</style>
  </head>
  <body>
    <main id="playground" aria-label="TokenPet 彩蛋游乐场">
      <h1 class="sr-only">TokenPet</h1>
      <canvas id="world" aria-hidden="true"></canvas>
      <div id="egg-controls" aria-label="彩色方块蛋"></div>
      <p id="loading" role="status"><span class="loading-cube"></span></p>
    </main>
    <aside id="usage-rail" aria-label="Demo tool availability">
      <div id="usage-tools" aria-label="Demo remaining quota">
        <span class="usage-tool" data-remaining="100" data-period="5-hour session" data-reset="Resets in 3h 20m" data-secondary="Weekly limit" data-secondary-remaining="76" data-secondary-reset="Resets in 4 days">
          <span class="usage-gauge" tabindex="0" aria-describedby="usage-tooltip"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="gauge-track" cx="20" cy="20" r="17" pathLength="100" /><circle class="gauge-value" cx="20" cy="20" r="17" pathLength="100" /></svg><img src="{{ICON_CLAUDE}}" alt="" /></span>
          <span class="usage-copy"><span class="usage-name">Claude</span><span class="usage-amount">100%</span></span>
        </span>
        <span class="usage-tool" data-remaining="68" data-period="3-hour session" data-reset="Resets in 1h 32m" data-secondary="Weekly limit" data-secondary-remaining="58" data-secondary-reset="Resets in 6 days">
          <span class="usage-gauge" tabindex="0" aria-describedby="usage-tooltip"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="gauge-track" cx="20" cy="20" r="17" pathLength="100" /><circle class="gauge-value" cx="20" cy="20" r="17" pathLength="100" /></svg><img src="{{ICON_CHATGPT}}" alt="" /></span>
          <span class="usage-copy"><span class="usage-name">ChatGPT</span><span class="usage-amount">68%</span></span>
        </span>
        <span class="usage-tool" data-remaining="41" data-period="Monthly limit · Cursor Models" data-reset="Resets in 9 days" data-secondary="Monthly limit · Other Models" data-secondary-remaining="69" data-secondary-reset="Resets in 9 days">
          <span class="usage-gauge" tabindex="0" aria-describedby="usage-tooltip"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="gauge-track" cx="20" cy="20" r="17" pathLength="100" /><circle class="gauge-value" cx="20" cy="20" r="17" pathLength="100" /></svg><img src="{{ICON_CURSOR}}" alt="" /></span>
          <span class="usage-copy"><span class="usage-name">Cursor</span><span class="usage-amount">41%</span></span>
        </span>
        <span class="usage-tool" data-remaining="17" data-period="Model requests" data-reset="Resets in 2h 45m" data-secondary="Weekly limit" data-secondary-remaining="16" data-secondary-reset="Resets in 2 days">
          <span class="usage-gauge" tabindex="0" aria-describedby="usage-tooltip"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="gauge-track" cx="20" cy="20" r="17" pathLength="100" /><circle class="gauge-value" cx="20" cy="20" r="17" pathLength="100" /></svg><img src="{{ICON_ANTIGRAVITY}}" alt="" /></span>
          <span class="usage-copy"><span class="usage-name">Antigravity</span><span class="usage-amount">17%</span></span>
        </span>
        <span class="usage-tool" data-remaining="83" data-period="Build sessions" data-reset="Resets in 2h 5m" data-secondary="Weekly limit" data-secondary-remaining="64" data-secondary-reset="Resets in 5 days">
          <span class="usage-gauge" tabindex="0" aria-describedby="usage-tooltip"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="gauge-track" cx="20" cy="20" r="17" pathLength="100" /><circle class="gauge-value" cx="20" cy="20" r="17" pathLength="100" /></svg><img src="{{ICON_GROK_BUILD}}" alt="" /></span>
          <span class="usage-copy"><span class="usage-name">Grok Build</span><span class="usage-amount">83%</span></span>
        </span>
      </div>
      <button id="usage-toggle" type="button" aria-label="Show demo tool availability" aria-expanded="false">
        <canvas id="usage-pet" aria-hidden="true"></canvas>
      </button>
    </aside>
    <div id="usage-tooltip" role="tooltip" aria-hidden="true" hidden></div>
    <button id="motion" type="button" aria-label="暂停跳动" aria-pressed="false">
      <svg class="pause-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 5h3v10H6zm5 0h3v10h-3z" /></svg>
      <svg class="play-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 9 6-9 6z" /></svg>
    </button>
    <script>{{SCRIPT}}</script>
  </body>
</html>
